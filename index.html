<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<title>Novo Gestor - Solicitações dos clientes | Takeat</title>
<style>
/* Takeat UI Kit - modo claro (tokens de foundations.md / components.md) */
:root{
  color-scheme: light;
  --surface-background:#F6F6F6; --surface-raised:#FFFFFF; --surface-nested:#F6F6F6; --surface-fill:#EDEDED;
  --text-primary:#222222; --text-secondary:#545454; --text-tertiary:#7A7A7A; --text-disabled:#C6C6C6; --text-inverted:#FFFFFF;
  --stroke-subtle:#EDEDED; --stroke-default:#C6C6C6; --stroke-strong:#7A7A7A;
  --gestor:#A82743; --gestor-dark:#75162B; --gestor-tint:rgba(168,39,67,.10);
  --green:#27A84C; --green-dark:#167532; --green-tint:rgba(39,168,76,.12);
  --yellow:#FFB32F; --yellow-tint:rgba(255,179,47,.35);
  --focus:#016999;
  --shadow-02:0 2px 4px rgba(0,0,0,.14),0 0 2px rgba(0,0,0,.12);
  --r4:4px; --r8:8px; --r12:12px;
}
*{box-sizing:border-box}
html{background:var(--surface-background)}
body{margin:0;background:var(--surface-background);color:var(--text-secondary);
  font-family:"Poppins",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px;line-height:20px;letter-spacing:.25px}
header{padding:24px 24px 8px;max-width:1280px;margin:0 auto}
.logo{display:block;height:40px;width:auto;margin-bottom:16px}
h1{margin:0 0 8px;font-size:28px;line-height:36px;font-weight:700;color:var(--text-primary);letter-spacing:0}
.sub{color:var(--text-tertiary);margin:0 0 16px;max-width:820px;font-size:14px;line-height:20px}
.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.layout{display:grid;grid-template-columns:288px minmax(0,1fr);gap:24px;max-width:1280px;margin:0 auto;padding:16px 24px 48px;align-items:start}
.side{position:sticky;top:16px;background:var(--surface-raised);border-radius:var(--r8);box-shadow:var(--shadow-02);padding:8px;max-height:calc(100vh - 32px);overflow-y:auto;display:flex;flex-direction:column;gap:2px;scrollbar-width:thin}
.tab{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;border:0;border-left:3px solid transparent;background:transparent;color:var(--text-secondary);padding:8px 12px;cursor:pointer;font:inherit;font-size:14px;line-height:20px;font-weight:500;border-radius:var(--r8)}
.tab:hover{background:var(--surface-fill)}
.tab.on{color:var(--gestor);background:var(--gestor-tint);border-left-color:var(--gestor);font-weight:700}
.tab .cnt{flex:none;font-size:12px;line-height:16px;font-weight:600;background:var(--surface-fill);color:var(--text-secondary);border-radius:9999px;padding:2px 8px;letter-spacing:.4px}
.tab.on .cnt{background:var(--surface-raised);color:var(--gestor)}
.tab.done .cnt{background:var(--green-tint);color:var(--green-dark)}
main{min-width:0}
@media (max-width:860px){.layout{grid-template-columns:1fr;padding:16px}.side{position:static;max-height:260px}}
.panel{background:var(--surface-raised);border-radius:var(--r8);padding:24px;box-shadow:var(--shadow-02)}
.ptitle{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline}
.ptitle h2{margin:0;font-size:22px;line-height:28px;font-weight:700;color:var(--text-primary);letter-spacing:0}
.meta{color:var(--text-tertiary);font-size:12px;line-height:16px;letter-spacing:.4px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
input[type=search],select{height:40px;border:1px solid var(--stroke-strong);background:var(--surface-raised);color:var(--text-secondary);padding:0 16px;border-radius:var(--r8);font:inherit;font-size:14px;font-weight:400}
input[type=search]::placeholder{color:var(--text-disabled)}
input[type=search]:hover,select:hover{border-color:var(--text-primary)}
input[type=search]:focus,select:focus{border-color:var(--focus)}
input[type=search]{flex:1;min-width:220px}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:760px}
th{text-align:left;font-size:12px;line-height:16px;font-weight:700;letter-spacing:.5px;color:var(--text-tertiary);padding:8px;border-bottom:1px solid var(--stroke-default);white-space:nowrap}
td{padding:12px 8px;border-bottom:1px solid var(--stroke-subtle);vertical-align:top}
tr:last-child td{border-bottom:none}
td.ck{width:48px}
td.ck input{width:24px;height:24px;accent-color:var(--green);cursor:pointer;margin:0}
.req{font-weight:600;color:var(--text-primary)}
.det{color:var(--text-tertiary);font-size:12px;line-height:16px;letter-spacing:.4px;margin-top:4px}
tr{transition:background-color .3s}
tr.done{background:var(--green-tint)}
.req-t{background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.5px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:color .3s}
tr.done .req-t{background-size:100% 1.5px;color:var(--text-tertiary)}
tr.strike-in .req-t{animation:sIn .4s ease-out}
tr.strike-out .req-t{animation:sOut .4s ease-out}
@keyframes sIn{from{background-size:0 1.5px}to{background-size:100% 1.5px}}
@keyframes sOut{from{background-size:100% 1.5px}to{background-size:0 1.5px}}
@media (prefers-reduced-motion:reduce){tr.strike-in .req-t,tr.strike-out .req-t{animation:none}}
.chip{display:inline-block;background:var(--surface-fill);color:var(--text-secondary);border-radius:var(--r4);padding:4px 8px;font-size:12px;line-height:16px;font-weight:600;letter-spacing:.4px}
.ref{display:inline-block;margin-left:8px;font-size:11px;line-height:16px;letter-spacing:.5px;color:var(--gestor);background:var(--gestor-tint);border-radius:var(--r4);padding:2px 8px;font-weight:600}
.n{font-variant-numeric:tabular-nums;text-align:center;font-weight:600;color:var(--text-primary);width:80px}
.cli{font-size:12px;line-height:16px;letter-spacing:.4px;color:var(--text-tertiary);max-width:340px}
.empty{padding:32px;text-align:center;color:var(--text-tertiary)}
.note{font-size:12px;line-height:16px;color:var(--text-tertiary);margin-top:12px}
mark{background:var(--yellow-tint);color:var(--text-primary);border-radius:2px;padding:0 1px}
@media print{.side,.tools{display:none}.layout{display:block}}
</style>
</head>

    var w = document.getElementById("warn");
    if(w) w.style.display = "block";
  }
  function id(tab, i){ return tab.key + ":" + i; }
  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function norm(s){ return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,""); }

  var filters = {}; // por aba: {q, cat, st}
  function f(tab){ return filters[tab.key] || (filters[tab.key] = {q:"", cat:"", st:""}); }

  function stats(tab){
    var d = 0; tab.items.forEach(function(_, i){ if(state.checks[id(tab,i)]) d++; });
    return {done:d, total:tab.items.length};
  }

  function renderTabs(){
    var el = document.getElementById("tabs"); el.innerHTML = "";
    DATA.forEach(function(t){
      var s = stats(t);
      var b = document.createElement("button");
      b.className = "tab" + (t.key === state.tab ? " on" : "") + (s.total && s.done === s.total ? " done" : "");
      b.setAttribute("role","tab");
      b.innerHTML = esc(t.name) + '<span class="cnt">' + s.done + "/" + s.total + "</span>";
      b.onclick = function(){ state.tab = t.key; save(); renderTabs(); renderPanel(); };
      el.appendChild(b);
    });
  }

  function hl(text, q){
    if(!q) return esc(text);
    var n = norm(text), nq = norm(q), out = "", pos = 0, idx;
    while((idx = n.indexOf(nq, pos)) !== -1){
      out += esc(text.slice(pos, idx)) + "<mark>" + esc(text.slice(idx, idx + q.length)) + "</mark>";
      pos = idx + q.length;
    }
    return out + esc(text.slice(pos));
  }

  function renderPanel(){
    var tab = DATA.filter(function(t){return t.key === state.tab;})[0] || DATA[0];
    var fl = f(tab), p = document.getElementById("panel");
    var cats = []; tab.items.forEach(function(it){ if(cats.indexOf(it[0]) < 0) cats.push(it[0]); });
    var s = stats(tab);
    var meta = tab.resp + " respostas recebidas" + (tab.util ? ", " + tab.util + " com conteúdo aproveitável" : "") + " | " + s.done + " de " + s.total + " itens concluídos";
    if(tab.key === "geral") meta = "Pedidos que não são de um relatório específico, mas apareceram nas pesquisas | " + s.done + " de " + s.total + " concluídos";
    var h = '<div class="ptitle"><h2>' + esc(tab.name) + '</h2><span class="meta">' + esc(meta) + "</span></div>";
    if(!tab.items.length){
      h += '<div class="empty">Esta pesquisa ainda não recebeu respostas. Nenhum item no checklist por enquanto.</div>';
      p.innerHTML = h; return;
    }
    h += '<div class="tools"><input type="search" id="q" placeholder="Filtrar nesta aba (requisito, detalhe, cliente...)" value="' + esc(fl.q) + '">' +
      '<select id="cat"><option value="">Todas as categorias</option>' + cats.map(function(c){return '<option' + (c === fl.cat ? " selected" : "") + ">" + esc(c) + "</option>";}).join("") + "</select>" +
      '<select id="st"><option value="">Todos</option><option value="p"' + (fl.st === "p" ? " selected" : "") + '>Pendentes</option><option value="d"' + (fl.st === "d" ? " selected" : "") + ">Concluídos</option></select></div>";
    h += '<div class="tablewrap"><table><thead><tr><th></th><th>Requisito</th><th>Categoria</th><th style="text-align:center">Menções</th><th>Clientes</th></tr></thead><tbody id="tb"></tbody></table></div>';
    h += '<p class="note" id="warn" style="display:' + (mem ? "block" : "none") + '">Não foi possível salvar as marcações neste navegador (armazenamento bloqueado).</p>';
    p.innerHTML = h;
    document.getElementById("q").oninput = function(){ fl.q = this.value; fillRows(tab); };
    document.getElementById("cat").onchange = function(){ fl.cat = this.value; fillRows(tab); };
    document.getElementById("st").onchange = function(){ fl.st = this.value; fillRows(tab); };
    fillRows(tab);
  }

  function cliStr(list){
    var named = [], anon = 0;
    list.forEach(function(x){ if(x === N) anon++; else named.push(x); });
    if(anon) named.push(anon > 1 ? anon + " clientes não identificados" : "1 cliente não identificado");
    return named.join(", ");
  }

  function fillRows(tab){
    var fl = f(tab), tb = document.getElementById("tb"), q = fl.q.trim(), nq = norm(q), html = "", shown = 0;
    var order = tab.items.map(function(_, i){return i;});
    order.sort(function(a, b){ return (tab.items[b][3].length - tab.items[a][3].length) || (a - b); });
    order.forEach(function(i){
      var it = tab.items[i];
      var done = !!state.checks[id(tab,i)];
      if(fl.cat && it[0] !== fl.cat) return;
      if(fl.st === "p" && done) return;
      if(fl.st === "d" && !done) return;
      var cli = cliStr(it[3]);
      var hay = norm(it[0] + " " + it[1] + " " + it[2] + " " + cli + " " + it[4]);
      if(nq && hay.indexOf(nq) < 0) return;
      shown++;
      var nm = it[3].length;
      html += '<tr class="' + (done ? "done" : "") + '"><td class="ck"><input type="checkbox" data-i="' + i + '"' + (done ? " checked" : "") + ' aria-label="Marcar como concluído"></td>' +
        '<td><div class="req"><span class="req-t">' + hl(it[1], q) + '</span>' + (it[4] ? '<span class="ref">também em: ' + esc(it[4]) + "</span>" : "") + "</div>" +
        (it[2] ? '<div class="det">' + hl(it[2], q) + "</div>" : "") + "</td>" +
        '<td><span class="chip">' + hl(it[0], q) + "</span></td>" +
        '<td class="n">' + nm + '</td><td class="cli">' + hl(cli, q) + "</td></tr>";
    });
    if(!shown) html = '<tr><td colspan="5" class="empty">Nenhum item encontrado com esses filtros.</td></tr>';
    tb.innerHTML = html;
    Array.prototype.forEach.call(tb.querySelectorAll("input[type=checkbox]"), function(c){
      c.onchange = function(){
        var k = id(tab, +c.getAttribute("data-i")), tr = c.closest("tr");
        if(c.checked) state.checks[k] = 1; else delete state.checks[k];
        save();
        tr.classList.remove("strike-in","strike-out");
        void tr.offsetWidth;
        tr.classList.toggle("done", c.checked);
        tr.classList.add(c.checked ? "strike-in" : "strike-out");
        renderTabs();
        var meta = document.querySelector(".ptitle .meta");
        if(meta && tab.key !== "geral"){ var s = stats(tab); meta.textContent = tab.resp + " respostas recebidas" + (tab.util ? ", " + tab.util + " com conteúdo aproveitável" : "") + " | " + s.done + " de " + s.total + " itens concluídos"; }
        else if(meta){ var s2 = stats(tab); meta.textContent = "Pedidos que não são de um relatório específico, mas apareceram nas pesquisas | " + s2.done + " de " + s2.total + " concluídos"; }
        if(f(tab).st) setTimeout(function(){ fillRows(tab); }, 500);
      };
    });
  }

  load();
  if(!DATA.some(function(t){return t.key === state.tab;})) state.tab = DATA[0].key;
  renderTabs(); renderPanel();
})();
</script>
</body>
</html>
